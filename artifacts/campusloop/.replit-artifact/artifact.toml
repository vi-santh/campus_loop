kind = "web"
previewPath = "/"
title = "CampusLoop"
description = "A campus-only resource exchange where students and organizations can list, discover, request, and complete reuse of useful materials."
version = "1.0.0"
id = "artifacts/campusloop"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21118

[services.development]
run = "npm run dev --workspace=@workspace/campusloop"

[services.production]
build = [ "npm", "run", "build", "--workspace=@workspace/campusloop" ]
serve = "static"
publicDir = "artifacts/campusloop/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21118"
BASE_PATH = "/"
